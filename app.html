<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gao Ke 的 APP 产品设计页面">
  <title>Gao Ke · APP</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap');

    :root {
      --paper: #f5f3ee;
      --paper-deep: #ebe8e1;
      --ink: #1f2524;
      --muted: #6e7571;
      --line: rgba(31, 37, 36, .14);
      --accent: #e4673f;
      --accent-deep: #bd482b;
      --mint: #cbded5;
      --yellow: #e6c85f;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body { margin: 0; color: var(--ink); background: var(--paper); font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif; line-height: 1.7; overflow-x: hidden; }
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: .35; background-image: radial-gradient(rgba(31,37,36,.1) .7px, transparent .7px); background-size: 16px 16px; mask-image: linear-gradient(to bottom, black, transparent 80%); }
    a { color: inherit; text-decoration: none; }
    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; }
    .mark { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: .04em; }
    .mark-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 5px 5px 0 var(--yellow); }
    .back { color: var(--muted); font: 12px 'DM Mono', monospace; letter-spacing: .1em; }
    .back:hover { color: var(--accent); }
    .hero { min-height: 560px; display: grid; grid-template-columns: 1.05fr .95fr; align-items: center; gap: 80px; padding: 70px 0 100px; }
    .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--accent-deep); font: 12px 'DM Mono', monospace; letter-spacing: .16em; text-transform: uppercase; }
    .eyebrow::before { content: ''; width: 38px; height: 1px; background: var(--accent); }
    h1 { max-width: 680px; margin: 18px 0 24px; font-size: clamp(54px, 8vw, 106px); line-height: .98; letter-spacing: -.08em; font-weight: 900; }
    h1 em { color: var(--accent); font-style: normal; }
    .hero-copy { max-width: 510px; color: var(--muted); font-size: 17px; }
    .hero-art { position: relative; min-height: 390px; }
    .phone { position: absolute; right: 12%; top: 5%; width: 190px; height: 370px; padding: 12px; border: 2px solid var(--ink); border-radius: 28px; background: var(--ink); transform: rotate(8deg); box-shadow: 20px 22px 0 var(--yellow); }
    .phone-screen { height: 100%; overflow: hidden; border-radius: 18px; background: var(--mint); }
    .screen-top { height: 92px; padding: 24px 16px; background: var(--accent); color: white; font: 12px 'DM Mono', monospace; }
    .screen-body { padding: 20px 14px; }
    .screen-body i { display: block; height: 10px; margin-bottom: 12px; border-radius: 10px; background: rgba(31,37,36,.25); }
    .screen-body i:nth-child(2) { width: 72%; background: var(--ink); }
    .screen-body i:nth-child(3) { width: 88%; }
    .screen-card { height: 122px; margin-top: 24px; border-radius: 16px; background: var(--paper); }
    .art-note { position: absolute; left: 2%; bottom: 8%; color: var(--accent-deep); font: 12px 'DM Mono', monospace; transform: rotate(-8deg); }
    .section { padding: 88px 0; border-top: 1px solid var(--line); }
    .section-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 40px; }
    .section-number { color: var(--accent); font: 14px 'DM Mono', monospace; }
    h2 { margin: 8px 0 0; font-size: clamp(34px, 5vw, 60px); line-height: 1; letter-spacing: -.07em; }
    .section-note { max-width: 310px; margin: 0; color: var(--muted); font-size: 14px; }
    .principles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; }
    .principle { min-height: 220px; padding: 26px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.28); }
    .principle:nth-child(2) { background: var(--mint); }
    .principle:nth-child(3) { background: var(--yellow); }
    .principle small { color: var(--accent-deep); font: 12px 'DM Mono', monospace; }
    .principle h3 { margin: 28px 0 8px; font-size: 23px; }
    .principle p { margin: 0; color: var(--muted); font-size: 14px; }
    .principle:nth-child(2) p, .principle:nth-child(3) p { color: var(--ink); }
    .process { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border-top: 1px solid var(--line); }
    .step { padding: 24px 24px 24px 0; border-right: 1px solid var(--line); }
    .step + .step { padding-left: 24px; }
    .step:last-child { border-right: 0; }
    .step strong { display: block; margin-bottom: 22px; color: var(--accent); font: 18px 'DM Mono', monospace; }
    .step h3 { margin: 0 0 8px; font-size: 19px; }
    .step p { margin: 0; color: var(--muted); font-size: 14px; }
    .cta { display: flex; justify-content: space-between; align-items: end; gap: 30px; padding: 90px 0 110px; }
    .cta h2 { max-width: 590px; }
    .button { display: inline-flex; align-items: center; gap: 9px; padding: 12px 18px; border: 1px solid var(--ink); border-radius: 999px; background: var(--ink); color: white; font-size: 14px; transition: transform .2s, box-shadow .2s; }
    .button:hover { transform: translateY(-3px); box-shadow: 5px 5px 0 var(--yellow); }
    .button svg { width: 15px; height: 15px; }
    .work-embed { padding: 34px 0 72px; border-top: 1px solid var(--line); }
    .work-embed-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 22px; }
    .work-embed-title { margin: 8px 0 0; font-size: clamp(30px, 4vw, 48px); line-height: 1; letter-spacing: -.06em; }
    .work-embed-note { max-width: 360px; margin: 0; color: var(--muted); font-size: 14px; }
    .work-frame { display: block; width: 100%; height: min(78vh, 900px); min-height: 620px; border: 1px solid var(--line); background: white; }
    .work-open { display: inline-flex; align-items: center; gap: 8px; margin-top: 14px; color: var(--accent-deep); font: 12px 'DM Mono', monospace; }
    .work-open:hover { color: var(--ink); }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 30px 0 36px; border-top: 1px solid var(--line); color: var(--muted); font: 11px 'DM Mono', monospace; }
    @media (max-width: 760px) {
      .shell { width: min(100% - 34px, 600px); }
      .topbar { padding: 20px 0; }
      .hero { min-height: auto; grid-template-columns: 1fr; gap: 30px; padding: 60px 0 78px; }
      .hero-art { min-height: 360px; }
      .phone { right: 18%; }
      .section { padding: 68px 0; }
      .section-head { display: block; }
      .section-note { margin-top: 20px; }
      .principles { grid-template-columns: 1fr; }
      .process { grid-template-columns: 1fr 1fr; }
      .step, .step + .step { padding: 22px 18px 22px 0; border-right: 0; border-bottom: 1px solid var(--line); }
      .step:nth-child(even) { padding-left: 18px; border-left: 1px solid var(--line); }
      .cta { display: block; padding: 68px 0 80px; }
      .cta .button { margin-top: 28px; }
      footer { display: block; }
      footer span { display: block; margin-top: 8px; }
    }
  </style>
</head>
<body>
  <header class="shell topbar">
    <a class="mark" href="index.html" aria-label="返回简历"><i class="mark-dot"></i>Gao Ke / APP</a>
    <a class="back" href="index.html">← BACK TO CV</a>
  </header>

  <main>
    <section class="shell work-embed">
      <div class="work-embed-head">
        <div><span class="section-number">01 / PREVIOUS WORK</span><h1 class="work-embed-title">我的其他作品</h1></div>
        <p class="work-embed-note">把之前的作品直接放进这里浏览，当前页面的页头和页尾仍然保留。</p>
      </div>
      <iframe class="work-frame" src="https://exo-kriswu-1106.github.io/CV/" title="Gao Ke 之前的作品" loading="lazy"></iframe>
      <a class="work-open" href="https://exo-kriswu-1106.github.io/CV/" target="_blank" rel="noreferrer">在新窗口打开作品 →</a>
    </section>
  </main>

  <footer class="shell"><span>© 2024 Gao Ke</span><span>APP / PRODUCT EXPERIENCE</span></footer>
</body>
</html>
