<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gao Ke的个人简历 - 产品设计师">
  <title>Gao Ke · 产品设计师</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap');

    :root {
      --paper: #f5f3ee;
      --paper-deep: #ebe8e1;
      --ink: #1f2524;
      --muted: #6e7571;
      --line: rgba(31, 37, 36, .14);
      --accent: #e4673f;
      --accent-deep: #bd482b;
      --mint: #cbded5;
      --yellow: #e6c85f;
      --shadow: 0 18px 48px rgba(31, 37, 36, .08);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--paper);
      font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
      line-height: 1.7;
      overflow-x: hidden;
    }
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: .35;
      background-image: radial-gradient(rgba(31,37,36,.1) .7px, transparent .7px);
      background-size: 16px 16px;
      mask-image: linear-gradient(to bottom, black, transparent 80%);
    }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; color: inherit; }
    .progress { position: fixed; inset: 0 0 auto; height: 4px; z-index: 20; background: transparent; }
    .progress span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .12s linear; }

    .shell { width: min(1180px, calc(100% - 48px)); margin: 0 auto; }
    .topbar { display: flex; justify-content: space-between; align-items: center; padding: 28px 0; }
    .mark { display: flex; align-items: center; gap: 10px; font-weight: 900; letter-spacing: .04em; }
    .mark-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 5px 5px 0 var(--yellow); }
    .topbar-actions { display: flex; align-items: center; gap: 12px; }
    .app-link { color: var(--accent-deep); font: 12px 'DM Mono', monospace; letter-spacing: .12em; }
    .app-link:hover { color: var(--ink); }
    .availability { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .availability i { width: 8px; height: 8px; border-radius: 50%; background: #72a58c; box-shadow: 0 0 0 5px rgba(114,165,140,.16); }
    .theme-toggle { border: 1px solid var(--line); border-radius: 999px; width: 40px; height: 40px; cursor: pointer; background: rgba(255,255,255,.25); transition: transform .2s, background .2s; }
    .theme-toggle:hover { transform: rotate(12deg); background: var(--mint); }

    .hero { min-height: 610px; display: grid; grid-template-columns: 1.2fr .8fr; align-items: center; gap: 80px; padding: 58px 0 90px; }
    .eyebrow { display: flex; align-items: center; gap: 12px; color: var(--accent-deep); font-family: 'DM Mono', monospace; font-size: 12px; text-transform: uppercase; letter-spacing: .16em; }
    .eyebrow::before { content: ''; width: 38px; height: 1px; background: var(--accent); }
    h1 { max-width: 720px; margin: 18px 0 20px; font-size: clamp(52px, 8vw, 108px); line-height: .99; letter-spacing: -.08em; font-weight: 900; }
    h1 em { color: var(--accent); font-style: normal; }
    .hero-copy { max-width: 540px; margin: 0; color: var(--muted); font-size: 17px; }
    .hero-links { display: flex; gap: 12px; margin-top: 34px; flex-wrap: wrap; }
    .button { display: inline-flex; align-items: center; gap: 9px; border: 1px solid var(--ink); border-radius: 999px; padding: 11px 18px; font-size: 14px; transition: .25s ease; }
    .button.primary { color: #fff; border-color: var(--ink); background: var(--ink); }
    .button:hover { transform: translateY(-3px); box-shadow: 5px 5px 0 var(--yellow); }
    .button svg { width: 15px; height: 15px; }

    .portrait { position: relative; width: min(370px, 100%); aspect-ratio: 1 / 1.12; justify-self: end; }
    .portrait::before, .portrait::after { content: ''; position: absolute; border: 1px solid var(--ink); border-radius: 50%; }
    .portrait::before { inset: -24px 34px 42px -28px; transform: rotate(-18deg); }
    .portrait::after { inset: 42px -24px -22px 44px; border-color: var(--accent); transform: rotate(16deg); }
    .portrait-card { position: absolute; inset: 0; overflow: hidden; border-radius: 46% 54% 51% 49% / 43% 39% 61% 57%; background: var(--mint); box-shadow: var(--shadow); }
    .portrait-card::before { content: 'GK'; position: absolute; left: 12%; bottom: -7%; color: rgba(255,255,255,.75); font: 900 clamp(150px, 20vw, 250px)/1 'Noto Sans SC'; letter-spacing: -.15em; }
    .portrait-card::after { content: ''; position: absolute; width: 100px; height: 100px; right: 13%; top: 14%; border-radius: 50%; background: var(--yellow); mix-blend-mode: multiply; }
    .portrait-label { position: absolute; right: -18px; bottom: 42px; z-index: 1; padding: 10px 14px; background: var(--accent); color: white; font: 12px 'DM Mono', monospace; transform: rotate(-7deg); }

    .section { padding: 92px 0; border-top: 1px solid var(--line); }
    .section-heading { display: flex; justify-content: space-between; align-items: end; gap: 25px; margin-bottom: 42px; }
    .section-heading h2 { margin: 8px 0 0; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -.07em; }
    .section-number { color: var(--accent); font: 14px 'DM Mono', monospace; }
    .section-note { max-width: 300px; margin: 0; color: var(--muted); font-size: 14px; }

    .timeline { position: relative; display: grid; gap: 0; }
    .timeline::before { content: ''; position: absolute; left: 139px; top: 20px; bottom: 20px; width: 1px; background: var(--line); }
    .timeline-item { position: relative; display: grid; grid-template-columns: 170px 1fr; gap: 46px; padding: 22px 0 42px; }
    .timeline-item::before { content: ''; position: absolute; top: 29px; left: 135px; width: 9px; height: 9px; border: 3px solid var(--paper); border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .timeline-date { color: var(--muted); font: 12px 'DM Mono', monospace; padding-top: 4px; }
    .timeline-content h3 { margin: 0 0 4px; font-size: 22px; letter-spacing: -.04em; }
    .timeline-content .company { color: var(--accent-deep); font-size: 14px; }
    .timeline-content p { max-width: 630px; margin: 14px 0 0; color: var(--muted); }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 17px; }
    .tag { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; color: var(--muted); font-size: 12px; }

    .education-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .edu-card { padding: 27px; border: 1px solid var(--line); border-radius: var(--radius); background: rgba(255,255,255,.28); transition: transform .25s, background .25s; }
    .edu-card:hover { transform: translateY(-6px); background: var(--mint); }
    .edu-card small { color: var(--accent-deep); font: 12px 'DM Mono', monospace; }
    .edu-card h3 { margin: 14px 0 4px; font-size: 21px; }
    .edu-card p { margin: 0; color: var(--muted); font-size: 14px; }

    .skills-layout { display: grid; grid-template-columns: .75fr 1.25fr; gap: 90px; align-items: start; }
    .skill-intro p { color: var(--muted); }
    .skill-filter { display: flex; gap: 8px; margin: 26px 0 0; flex-wrap: wrap; }
    .filter { border: 1px solid var(--line); border-radius: 999px; padding: 7px 13px; background: transparent; cursor: pointer; font-size: 12px; transition: .2s; }
    .filter.active, .filter:hover { color: #fff; border-color: var(--ink); background: var(--ink); }
    .skill-list { display: grid; grid-template-columns: 1fr 1fr; gap: 26px 45px; }
    .skill-item { transition: opacity .2s, transform .2s; }
    .skill-item.is-hidden { display: none; }
    .skill-top { display: flex; justify-content: space-between; gap: 12px; font-size: 14px; }
    .skill-top span:last-child { color: var(--muted); font: 12px 'DM Mono', monospace; }
    .meter { height: 5px; margin-top: 10px; overflow: hidden; border-radius: 10px; background: var(--paper-deep); }
    .meter i { display: block; width: var(--level); height: 100%; border-radius: inherit; background: var(--meter-color, #72a58c); transform-origin: left; animation: grow 1.2s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes grow { from { transform: scaleX(0); } to { transform: scaleX(1); } }

    .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: end; }
    .contact h2 { max-width: 540px; margin-bottom: 20px; }
    .contact-copy { max-width: 450px; color: var(--muted); }
    .contact-list { display: grid; gap: 12px; justify-items: start; }
    .contact-link { display: inline-flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); transition: color .2s, padding .2s; }
    .contact-link:hover { color: var(--accent); padding-left: 8px; }
    .contact-link svg { width: 17px; height: 17px; }
    .app-embed { padding: 72px 0; border-top: 1px solid var(--line); }
    .app-embed-head { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: 24px; }
    .app-embed-title { margin: 8px 0 0; font-size: clamp(32px, 5vw, 56px); line-height: 1; letter-spacing: -.07em; }
    .app-embed-note { max-width: 320px; margin: 0; color: var(--muted); font-size: 14px; }
    .app-frame { display: block; width: 100%; height: 820px; border: 1px solid var(--line); background: var(--paper); }
    footer { display: flex; justify-content: space-between; gap: 20px; padding: 30px 0 36px; color: var(--muted); font: 11px 'DM Mono', monospace; border-top: 1px solid var(--line); }

    .reveal { opacity: 0; transform: translateY(24px); transition: opacity .75s ease, transform .75s ease; }
    .reveal.visible { opacity: 1; transform: none; }
    .dark { --paper: #202624; --paper-deep: #303834; --ink: #f1eee6; --muted: #a9afa8; --line: rgba(241,238,230,.16); --mint: #2f4c45; --yellow: #c4a842; --shadow: 0 18px 48px rgba(0,0,0,.18); }
    .dark .button.primary { border-color: var(--accent); background: var(--accent); }
    .dark .portrait-card::before { color: rgba(255,255,255,.1); }

    @media (max-width: 760px) {
      .shell { width: min(100% - 34px, 600px); }
      .topbar { padding: 20px 0; }
      .availability { display: none; }
      .hero { min-height: auto; grid-template-columns: 1fr; gap: 58px; padding: 58px 0 78px; overflow: hidden; }
      h1 { font-size: clamp(54px, 17vw, 88px); }
      .portrait { width: min(290px, 80vw); justify-self: center; }
      .section { padding: 68px 0; }
      .section-heading { display: block; }
      .section-note { margin-top: 20px; }
      .timeline::before { left: 5px; }
      .timeline-item { display: block; padding: 20px 0 38px 28px; }
      .timeline-item::before { left: 0; top: 24px; }
      .timeline-date { margin-bottom: 13px; }
      .education-grid, .skills-layout, .contact { grid-template-columns: 1fr; gap: 34px; }
      .app-embed-head { display: block; }
      .app-embed-note { margin-top: 20px; }
      .app-frame { height: 760px; }
      .skill-list { gap: 23px; }
      footer { display: block; }
      footer span { display: block; margin-top: 8px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="progress"><span id="progressBar"></span></div>
  <header class="shell topbar">
    <a class="mark" href="#top" aria-label="回到顶部"><i class="mark-dot"></i>Gao Ke / CV</a>
    <div class="topbar-actions">
      <a class="app-link" href="app.html">APP</a>
      <span class="availability"><i></i>正在寻找好项目</span>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="切换明暗主题" title="切换明暗主题">◐</button>
    </div>
  </header>

  <main id="top"></main>
  <footer class="shell" id="footer"></footer>

  <script src="resume-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
